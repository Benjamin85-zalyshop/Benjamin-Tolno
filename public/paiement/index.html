<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScolaPay - Redirection Paiement</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F3F4F6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #1F2937;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #E5E7EB;
            border-top-color: #1D4ED8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h3 style="margin-bottom: 0.5rem; color: #1D4ED8;">Ouverture du module de paiement...</h3>
        <p style="font-size: 0.9rem; color: #6B7280; line-height: 1.4;">Veuillez patienter pendant la redirection vers le paiement sécurisé de la scolarité.</p>
    </div>

    <script>
        (function() {
            var search = window.location.search;
            if (!search || search.length < 5) {
                var cached = sessionStorage.getItem('scolapay_last_query') || localStorage.getItem('scolapay_last_query');
                if (cached) {
                    search = cached.startsWith('?') ? cached : ('?' + cached);
                }
            }
            var delim = search ? (search.includes('?') ? '&' : '?') : '?';
            var finalUrl = '/' + (search || '') + delim + 'open_payment=true';
            window.location.replace(finalUrl);
        })();
    </script>
</body>
</html>
