<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScolaPay - Confirmation du Paiement</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F8FAFC;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #1E293B;
            padding: 1rem;
        }
        .card {
            background: white;
            padding: 2.5rem 1.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 440px;
            width: 100%;
        }
        .icon {
            width: 64px;
            height: 64px;
            background: #DCFCE7;
            color: #16A34A;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem auto;
            font-size: 32px;
        }
        h2 {
            margin: 0 0 0.5rem 0;
            color: #0F172A;
            font-size: 1.4rem;
        }
        p {
            font-size: 0.95rem;
            color: #64748B;
            line-height: 1.5;
            margin: 0 0 1.5rem 0;
        }
        .btn {
            display: inline-block;
            background-color: #1D4ED8;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover {
            background-color: #1E40AF;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✓</div>
        <h2>Paiement Pris en Compte</h2>
        <p>Merci pour votre règlement via ChapChapPay. Votre abonnement est en cours d'activation automatique dans votre application ScolaPay.</p>
        <a id="open-app-btn" class="btn" href="scolapay://paiement/return">Ouvrir l'application ScolaPay</a>
    </div>

    <script>
        (function() {
            var search = window.location.search || '';
            var appUrl = "scolapay://paiement/return" + search;
            
            var btn = document.getElementById('open-app-btn');
            if (btn) {
                btn.href = appUrl;
            }

            // Redirection automatique vers l'application mobile Android
            try {
                window.location.href = appUrl;
            } catch(e) {}
        })();
    </script>
</body>
</html>
